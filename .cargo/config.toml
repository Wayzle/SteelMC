# https://github.com/bevyengine/bevy/blob/main/.cargo/config_fast_builds.toml for more details

[build]
rustflags = ["-Zthreads=0"]
incremental = true

[target.x86_64-unknown-linux-gnu]
rustflags = ["-Clink-arg=-fuse-ld=lld", "-Zthreads=0"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-Clink-arg=-fuse-ld=lld", "-Zthreads=0"]

[target.aarch64-linux-android]
linker = "aarch64-linux-android-clang"
 
[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi-clang"
 
[target.i686-linux-android]
linker = "i686-linux-android-clang"
 
[target.x86_64-linux-android]
linker = "x86_64-linux-android-clang"

[alias]
flint = ["test", "-p", "steel-flint", "--profile", "flint", "test_run_flint_selected", "--", "--ignored"]
flint-dev = ["test", "-p", "steel-flint", "test_run_flint_selected", "--", "--ignored"]
flint-release = ["test", "-p", "steel-flint", "--profile", "cicd", "test_run_flint_selected", "--", "--ignored"]
build-native = [
  "build",
  "--config",
  "build.rustflags=[\"-Zthreads=0\",\"-C\",\"target-cpu=native\"]",
  "--config",
  "target.x86_64-unknown-linux-gnu.rustflags=[\"-Clink-arg=-fuse-ld=lld\",\"-Zthreads=0\",\"-C\",\"target-cpu=native\"]",
  "--config",
  "target.aarch64-unknown-linux-gnu.rustflags=[\"-Clink-arg=-fuse-ld=lld\",\"-Zthreads=0\",\"-C\",\"target-cpu=native\"]",
]
run-native = [
  "run",
  "--config",
  "build.rustflags=[\"-Zthreads=0\",\"-C\",\"target-cpu=native\"]",
  "--config",
  "target.x86_64-unknown-linux-gnu.rustflags=[\"-Clink-arg=-fuse-ld=lld\",\"-Zthreads=0\",\"-C\",\"target-cpu=native\"]",
  "--config",
  "target.aarch64-unknown-linux-gnu.rustflags=[\"-Clink-arg=-fuse-ld=lld\",\"-Zthreads=0\",\"-C\",\"target-cpu=native\"]",
]
